{% extends "dashboard_base.html" %}
{% block title %}Create User — {{ app_name }}{% endblock %}

{% block nav_items %}
<li class="nav-item"><a class="nav-link" href="{{ url_for('admin.dashboard') }}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('admin.users') }}"><i class="bi bi-people"></i> Users</a></li>
{% endblock %}

{% block content %}
<div class="dash-header">
    <div class="container-fluid px-4">
        <h1>Create User</h1>
        <p class="lead">Add a new user to the system</p>
    </div>
</div>

<div class="container-fluid px-4">
    <div class="content-card" style="max-width: 600px;">
        <div class="content-card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required minlength="8">
                </div>
                <div class="mb-4">
                    <label class="form-label" for="role">Role</label>
                    <select class="form-select" id="role" name="role">
                        <option value="candidate">Candidate</option>
                        <option value="newhire">New Hire</option>
                        <option value="manager">Hiring Manager</option>
                        <option value="admin">Admin / HR</option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-be">Create User</button>
                    <a href="{{ url_for('admin.users') }}" class="btn btn-be-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
