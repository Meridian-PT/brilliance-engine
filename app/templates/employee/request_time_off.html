{% extends "dashboard_base.html" %}
{% block title %}Request Time Off — {{ app_name }}{% endblock %}

{% block nav_items %}
<li class="nav-item"><a class="nav-link" href="{{ url_for('employee.dashboard') }}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
<li class="nav-item"><a class="nav-link active" href="{{ url_for('employee.time_off') }}"><i class="bi bi-calendar2-heart"></i> Time Off</a></li>
<li class="nav-item"><a class="nav-link{% if request.endpoint == 'directory.index' %} active{% endif %}" href="{{ url_for('directory.index') }}"><i class="bi bi-person-lines-fill"></i> Directory</a></li>
<li class="nav-item"><a class="nav-link{% if request.endpoint == 'directory.orgchart' %} active{% endif %}" href="{{ url_for('directory.orgchart') }}"><i class="bi bi-diagram-3"></i> Org Chart</a></li>
{% endblock %}

{% block content %}
<div class="container-fluid px-4 mt-4">
    <a href="{{ url_for('employee.time_off') }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
        <i class="bi bi-arrow-left"></i> Back to Time Off
    </a>

    <div class="content-card mt-3" style="max-width: 600px;">
        <div class="content-card-header">
            <h3><i class="bi bi-calendar-plus"></i> Request Time Off</h3>
        </div>
        <div class="content-card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Leave Type</label>
                    <select name="leave_type" class="form-select" required>
                        <option value="vacation">Vacation</option>
                        <option value="sick">Sick Leave</option>
                        <option value="personal">Personal Day</option>
                        <option value="bereavement">Bereavement</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Start Date</label>
                        <input type="date" name="start_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">End Date</label>
                        <input type="date" name="end_date" class="form-control" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Reason (optional)</label>
                    <textarea name="reason" class="form-control" rows="3" placeholder="Brief reason for your request..."></textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('employee.time_off') }}" class="btn btn-be-outline">Cancel</a>
                    <button type="submit" class="btn btn-be-gold">
                        <i class="bi bi-send"></i> Submit Request
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
