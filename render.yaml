services:
  - type: web
    name: brilliance-engine
    runtime: python
    buildCommand: pip install -r requirements.txt && mkdir -p instance
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"
